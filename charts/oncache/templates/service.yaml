{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oncache.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oncache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.metrics.serviceType }}
  selector:
    {{- include "oncache.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.metrics.port }}
      targetPort: http
      protocol: TCP
{{- end }}
