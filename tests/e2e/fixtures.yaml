  name: pod-a
  namespace: oncache-e2e
  labels:
    app: oncache-e2e
spec:
  nodeName: NODE_A
  containers:
    - name: app
      image: oncache-agent:m3-e2e
      command: ["sh", "-c", "sleep 3600"]
