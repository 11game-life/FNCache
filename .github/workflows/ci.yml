name: M1 BPF CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bpf:
    name: Build and test BPF datapath
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            clang \
            llvm \
            gcc \
            make \
            pkg-config \
            libbpf-dev \
            libelf-dev \
            zlib1g-dev

      - name: Build BPF ELF and run ABI test
        env:
          BUILD_ROOT: ${{ runner.temp }}/oncache-build
        run: |
          set -euo pipefail
          make -C bpf \
            CLANG=clang \
            LLC=llc \
            BUILD_DIR="$BUILD_ROOT/bpf" \
            all
          make -C tests \
            CC=gcc \
            BUILD_DIR="$BUILD_ROOT/tests" \
            test

      - name: Run BPF behavior and fault-injection tests
        env:
          BUILD_ROOT: ${{ runner.temp }}/oncache-build
        run: |
          set -euo pipefail
          make -C tests \
            CC=gcc \
            CLANG=clang \
            LLC=llc \
            BUILD_DIR="$BUILD_ROOT/tests" \
            RUN="sudo -n" \
            test-bpf
